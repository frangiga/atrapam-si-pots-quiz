<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entrenament - Atrapa'm si pots</title>
  <style>
    :root {
      --bg-main: #060e1a;
      --card-bg-center: #162b4d;
      --card-bg-edge: #0b172a;
      --accent-yellow: #ffd600;
      --accent-yellow-glow: rgba(255, 214, 0, 0.6);
      --accent-blue: #00b4d8;
      --accent-blue-glow: rgba(0, 180, 216, 0.5);
      --text-light: #f8f9fa;
      --text-muted: #94a3b8;
      --correct: #00e676;
      --correct-glow: rgba(0, 230, 118, 0.6);
      --incorrect: #ff1744;
      --incorrect-glow: rgba(255, 23, 68, 0.6);
      --btn-bg: rgba(23, 42, 69, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at center, #102a45 0%, #040914 100%);
      color: var(--text-light);
      height: 100dvh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 12px;
    }

    .quiz-container {
      background: radial-gradient(circle at center, var(--card-bg-center) 0%, var(--card-bg-edge) 100%);
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 780px;
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(0, 180, 216, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 180, 216, 0.4);
      padding: 18px 18px 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    .brand-logo {
      display: block;
      max-height: 100px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 180, 216, 0.3));
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 18px;
      border-radius: 14px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .score-board {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-yellow);
      text-shadow: 0 0 10px var(--accent-yellow-glow);
    }

    .progress {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .category-badge {
      display: inline-block;
      align-self: center;
      background: rgba(0, 180, 216, 0.2);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 0 15px var(--accent-blue-glow), inset 0 0 8px rgba(0, 180, 216, 0.3);
      text-shadow: 0 0 8px var(--accent-blue-glow);
      text-align: center;
    }

    .question-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 8px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-light);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .option-btn {
      background: var(--btn-bg);
      color: var(--text-light);
      border: 1px solid rgba(0, 180, 216, 0.35);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.95rem;
      text-align: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      display: flex;
      align-items: center;
      min-height: 50px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 8px rgba(0, 180, 216, 0.15);
      backdrop-filter: blur(6px);
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background-color: var(--correct) !important;
      border-color: var(--correct) !important;
      color: #000 !important;
      font-weight: 800;
      box-shadow: 0 0 22px var(--correct-glow) !important;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect) !important;
      border-color: var(--incorrect) !important;
      color: #fff !important;
      box-shadow: 0 0 22px var(--incorrect-glow) !important;
    }

    .next-micro-btn {
      position: absolute;
      bottom: 32px;
      right: 18px;
      background: var(--accent-yellow);
      color: #000;
      border: 1px solid #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 18px var(--accent-yellow-glow), 0 0 8px #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: pulse 1.5s infinite;
      z-index: 10;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 15px var(--accent-yellow-glow); }
      50% { transform: scale(1.08); box-shadow: 0 0 25px var(--accent-yellow-glow), 0 0 12px #fff; }
      100% { transform: scale(1); box-shadow: 0 0 15px var(--accent-yellow-glow); }
    }

    .app-footer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 10px;
      padding-top: 4px;
    }

    .app-footer a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .app-footer a:hover {
      text-decoration: underline;
    }

    .restart-btn {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 0 20px var(--accent-yellow-glow);
    }

    .hidden { display: none !important; }
    
    .results-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
      gap: 16px;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div id="game-screen" style="display: flex; flex-direction: column; height: 100%; justify-content: space-between; position: relative;">
      
      <div class="top-section">
        <img class="brand-logo" src="https://static.apuntmedia.es/clip/da57fb20-aa5d-4c8c-92e0-cfb8d38c7949_source-aspect-ratio_360w_0.webp" alt="Atrapa'm si pots">
        
        <div class="header">
          <span class="score-board" id="score">Punts: 0</span>
          <span class="progress" id="progress">1 / 1000</span>
        </div>

        <span class="category-badge" id="category">Categoria</span>
      </div>

      <div class="question-box">
        <h2 class="question-text" id="question">Carregant...</h2>
      </div>
      
      <div class="options-grid" id="options"></div>

      <button id="next-btn" class="next-micro-btn hidden" onclick="nextQuestion()">
        Següent ➔
      </button>

      <footer class="app-footer">
        Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
      </footer>
    </div>

    <div id="results-screen" class="results-screen hidden">
      <h2 style="color: var(--accent-yellow); font-size: 1.8rem; text-shadow: 0 0 15px var(--accent-yellow-glow);">Entrenament Finalitzat! 🎉</h2>
      <p id="final-score" style="font-size: 1.2rem; color: var(--text-light);"></p>
      <button class="restart-btn" onclick="startGame()">Tornar a començar</button>
      
      <footer class="app-footer" style="margin-top: 20px;">
        Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
      </footer>
    </div>
  </div>

  <script>
    function generate1000Questions() {
      const uniqueQuestions = [];
      const usedQuestionsSet = new Set();

      function addQ(cat, qText, correctOpt, false1, false2) {
        if (!usedQuestionsSet.has(qText)) {
          usedQuestionsSet.add(qText);
          uniqueQuestions.push({
            category: cat,
            question: qText,
            options: [correctOpt, false1, false2],
            answer: correctOpt
          });
        }
      }

      // --- MÚSICA VALENCIANA I GRUPS ---
      const grupsMusica = [
        { grup: "La Gossa Sorda", origen: "Pego", canco: "Camals mullats", estil: "Ska / Rock" },
        { grup: "Zoo", origen: "Gandia", canco: "Tobogan", estil: "Rap / Electrònica" },
        { grup: "Aspencat", origen: "Xaló", canco: "La distància", estil: "Reggae / Ska" },
        { grup: "La Fúmiga", origen: "Alzira", canco: "Mediterrània", estil: "Festiva / Brass band" },
        { grup: "El Diluvi", origen: "Alcoi", canco: "Alegria", estil: "Folk modern" },
        { grup: "Auxili", origen: "Ontinyent", canco: "Hui la liem", estil: "Reggae" },
        { grup: "Smoking Souls", origen: "Pego", canco: "1632", estil: "Rock" },
        { grup: "Al Tall", origen: "València", canco: "Tio Canya", estil: "Música tradicional" },
        { grup: "Obrint Pas", origen: "València", canco: "La flama", estil: "Ska / Rock" },
        { grup: "Tardor", origen: "València", canco: "El cel rogent", estil: "Indie Rock" },
        { grup: "Gener", origen: "Carcaixent", canco: "Cugat", estil: "Pop Rock" },
        { grup: "Ciudad Jara", origen: "Gandia", canco: "Bailar con las olas", estil: "Rock d'autor" },
        { grup: "Orxata Sound System", origen: "València", canco: "Niça muke", estil: "Electrònica / Cumbia" },
        { grup: "Sva-ters", origen: "Alcàsser", canco: "Romanç de cego", estil: "Ska" },
        { grup: "Xavi Sarrià", origen: "Almassora", canco: "No s'apaga la flama", estil: "Rock / Folk" },
        { grup: "Raimon", origen: "Xàtiva", canco: "Al vent", estil: "Nova Cançó" }
      ];

      grupsMusica.forEach(g => {
        const altOrigens = grupsMusica.filter(x => x.origen !== g.origen).map(x => x.origen);
        addQ("Música Valenciana", `De quina localitat és originari el grup '${g.grup}'?`, g.origen, altOrigens[0], altOrigens[1]);

        const altCançons = grupsMusica.filter(x => x.canco !== g.canco).map(x => x.canco);
        addQ("Música Valenciana", `Quina d'aquestes cançons és un tema del grup '${g.grup}'?`, g.canco, altCançons[0], altCançons[1]);

        const altEstils = ["Heavy Metal", "Flamenco", "Música Clàssica", "Jazz Tradicional"].filter(e => e !== g.estil);
        addQ("Música Valenciana", `Quin estil musical caracteritza principalment a '${g.grup}'?`, g.estil, altEstils[0], altEstils[1]);
      });

      // --- COMARQUES I CAPITALS VALENCIANES ---
      const comarques = [
        { nom: "La Marina Alta", cap: "Dénia" }, { nom: "La Marina Baixa", cap: "La Vila Joiosa" },
        { nom: "La Safor", cap: "Gandia" }, { nom: "La Ribera Alta", cap: "Alzira" },
        { nom: "La Ribera Baixa", cap: "Sueca" }, { nom: "L'Alcoià", cap: "Alcoi" },
        { nom: "El Comtat", cap: "Cocentaina" }, { nom: "L'Alt Maestrat", cap: "Albocàsser" },
        { nom: "El Baix Maestrat", cap: "Vinaròs" }, { nom: "La Plana Alta", cap: "Castelló de la Plana" },
        { nom: "La Plana Baixa", cap: "Borriana" }, { nom: "El Camp de Morvedre", cap: "Sagunt" },
        { nom: "El Camp de Túria", cap: "Llíria" }, { nom: "L'Horta Nord", cap: "Puçol" },
        { nom: "L'Horta Sud", cap: "Torrent" }, { nom: "La Vall d'Albaida", cap: "Ontinyent" },
        { nom: "El Baix Vinalopó", cap: "Elx" }, { nom: "L'Alt Vinalopó", cap: "Villena" },
        { nom: "El Vinalopó Mitjà", cap: "Elda" }, { nom: "La Vega Baixa", cap: "Oriola" },
        { nom: "Els Ports", cap: "Morella" }, { nom: "L'Alt Palància", cap: "Sogorb" },
        { nom: "La Foia de Bunyol", cap: "Bunyol" }, { nom: "El Valle de Ayora-Cofrentes", cap: "Aiora" },
        { nom: "La Canal de Navarrés", cap: "Enguera" }, { nom: "La Costera", cap: "Xàtiva" },
        { nom: "El Los Serranos", cap: "Xelva" }
      ];

      comarques.forEach((c, idx) => {
        const altCap1 = comarques[(idx + 1) % comarques.length].cap;
        const altCap2 = comarques[(idx + 2) % comarques.length].cap;
        addQ("Geografia Valenciana", `Quina és la capital de la comarca de ${c.nom}?`, c.cap, altCap1, altCap2);

        const altCom1 = comarques[(idx + 3) % comarques.length].nom;
        const altCom2 = comarques[(idx + 4) % comarques.length].nom;
        addQ("Geografia Valenciana", `A quina comarca pertany el municipi de ${c.cap}?`, c.nom, altCom1, altCom2);
      });

      // --- CAPITALS DEL MÓN ---
      const capitalsMon = [
        { pais: "França", cap: "París", f1: "Lió", f2: "Marsella" },
        { pais: "Itàlia", cap: "Roma", f1: "Milà", f2: "Nàpols" },
        { pais: "Alemanya", cap: "Berlín", f1: "Múnic", f2: "Frankfurt" },
        { pais: "Japó", cap: "Tòquio", f1: "Kioto", f2: "Osaka" },
        { pais: "Portugal", cap: "Lisboa", f1: "Porto", f2: "Coïmbra" },
        { pais: "Regne Unit", cap: "Londres", f1: "Manchester", f2: "Liverpool" },
        { pais: "Grècia", cap: "Atenes", f1: "Salònica", f2: "Heràclion" },
        { pais: "Egipte", cap: "El Caire", f1: "Alexandria", f2: "Gizeh" },
        { pais: "Austràlia", cap: "Canberra", f1: "Sydney", f2: "Melbourne" },
        { pais: "Canadà", cap: "Ottawa", f1: "Toronto", f2: "Vancouver" },
        { pais: "Brasil", cap: "Brasília", f1: "Rio de Janeiro", f2: "São Paulo" },
        { pais: "Argentina", cap: "Buenos Aires", f1: "Mendoza", f2: "Rosario" },
        { pais: "Mèxic", cap: "Ciutat de Mèxic", f1: "Guadalajara", f2: "Monterrey" },
        { pais: "Suïssa", cap: "Berna", f1: "Ginebra", f2: "Zuric" },
        { pais: "Bèlgica", cap: "Brussel·les", f1: "Bruges", f2: "Anvers" },
        { pais: "Països Baixos", cap: "Amsterdam", f1: "Rotterdam", f2: "La Haia" },
        { pais: "Suècia", cap: "Estocolm", f1: "Gothenburg", f2: "Malmö" },
        { pais: "Noruega", cap: "Oslo", f1: "Bergen", f2: "Trondheim" },
        { pais: "Finlàndia", cap: "Hèlsinki", f1: "Tampere", f2: "Turku" },
        { pais: "Polònia", cap: "Varsòvia", f1: "Cracòvia", f2: "Gdansk" },
        { pais: "Àustria", cap: "Viena", f1: "Salzburg", f2: "Innsbruck" },
        { pais: "Irlanda", cap: "Dublín", f1: "Cork", f2: "Galway" }
      ];

      capitalsMon.forEach(c => {
        addQ("Geografia Mundial", `Quina és la capital oficial de ${c.pais}?`, c.cap, c.f1, c.f2);
        addQ("Geografia Mundial", `De quin país és capital la ciutat de ${c.cap}?`, c.pais, "Espanya", "Xile");
      });

      // --- CULTURA GENERAL I VALENCIANA ---
      const multidata = [
        { cat: "Cultura Valenciana", q: "Quin monument gòtic civil de València és Patrimoni de la Humanitat?", a: "La Llotja de la Seda", f1: "Torres de Serrans", f2: "El Micalet" },
        { cat: "Geografia Valenciana", q: "Quin és el punt més alt geogràfic de la Comunitat Valenciana?", a: "El Calderón", f1: "Penyagolosa", f2: "Aitana" },
        { cat: "Festes i Tradicions", q: "En quina ciutat se celebra el famós Misteri d'origen medieval?", a: "Elx", f1: "Oriola", f2: "Castelló" },
        { cat: "Gastronomia Valenciana", q: "Quin ingredient és la base principal tradicional de l'orxata?", a: "Xufa", f1: "Ametlla", f2: "Arròs" },
        { cat: "Història Valenciana", q: "En quin any va entrar oficialment Jaume I a la ciutat de València?", a: "1238", f1: "1492", f2: "1707" },
        { cat: "Art i Literatura", q: "Qui és l'autor de la gran obra clàssica 'Tirant lo Blanch'?", a: "Joanot Martorell", f1: "Ausiàs March", f2: "Jordi de Sant Jordi" },
        { cat: "Festes i Tradicions", q: "A quina localitat de la Foia de Bunyol se celebra 'La Tomatina'?", a: "Buñol", f1: "Xàtiva", f2: "Morella" },
        { cat: "Geografia Valenciana", q: "Quina illa habitada es troba davant de les costes de Santa Pola?", a: "Tabarca", f1: "Columbrets", f2: "Benidorm" },
        { cat: "Art i Pintura", q: "Quin pintor valencià destaca per la seua llum i escenes de la mar?", a: "Joaquim Sorolla", f1: "Josep de Ribera", f2: "Ignasi Pinazo" },
        { cat: "Música Clàssica", q: "Qui va composar el 'Concierto de Aranjuez', sent de Sagunt?", a: "Joaquín Rodrigo", f1: "Vicent Martín i Soler", f2: "Ruperto Chapí" },
        { cat: "Natura Valenciana", q: "Quin d'aquestes paratges és una gran llaguna d'aigua dolça a València?", a: "L'Albufera", f1: "El Prat de Cabanes", f2: "Salinas de Torrevieja" },
        { cat: "Història Valenciana", q: "Quina va ser la data de la Batalla d'Almansa i abolició dels Furs?", a: "1707", f1: "1808", f2: "1936" },
        { cat: "Ciència i Natura", q: "Quin és el planeta de major grandària de tot el Sistema Solar?", a: "Júpiter", f1: "Saturn", f2: "Neptú" },
        { cat: "Història Universal", q: "En quin any va arribar per primera vegada Cristòfor Colom a Amèrica?", a: "1492", f1: "1508", f2: "1485" },
        { cat: "Cinema", q: "Quin director de cinema va dirigir la pel·lícula 'Jurassic Park'?", a: "Steven Spielberg", f1: "George Lucas", f2: "James Cameron" },
        { cat: "Literatura Universal", q: "Qui va escriure la cèlebre obra 'Don Quijote de la Mancha'?", a: "Miguel de Cervantes", f1: "Lope de Vega", f2: "Calderón de la Barca" },
        { cat: "Art i Pintura", q: "En quin famós museu es troba el quadre de 'La Gioconda'?", a: "Museu del Louvre", f1: "Museu del Prado", f2: "British Museum" },
        { cat: "Ciència i Natura", q: "Quin és l'element químic simbolitzat amb la lletra 'O'?", a: "Oxigen", f1: "Or", f2: "Osmi" },
        { cat: "Història Universal", q: "Quina civilització antiga va construir les piràmides de Gizeh?", a: "Egípcia", f1: "Romana", f2: "Grega" },
        { cat: "Música Internacional", q: "Quin grup britànic va publicar l'àlbum musical 'Abbey Road'?", a: "The Beatles", f1: "The Rolling Stones", f2: "Queen" },
        { cat: "Geografia Mundial", q: "Quin és considerat el riu més llarg i cabalós del món?", a: "Amazones", f1: "Nil", f2: "Mississipí" },
        { cat: "Anatomia Humana", q: "Quants ossos té aproximadament el cos humà adult?", a: "206", f1: "185", f2: "300" },
        { cat: "Esports", q: "Cada quants anys se celebren habitualment els Jocs Olímpics d'Estiu?", a: "4 anys", f1: "2 anys", f2: "5 anys" }
      ];

      multidata.forEach(d => addQ(d.cat, d.q, d.a, d.f1, d.f2));

      // OPERACIONES MATEMÁTICAS LIMPIAS Y NATURALES (SIN CÓDIGOS NI SÍMBOLOS RARS)
      let num1 = 2;
      let num2 = 3;

      while (uniqueQuestions.length < 1000) {
        num1 += 3;
        num2 += 2;
        
        const qText1 = `Quant és la suma de ${num1} + ${num2}?`;
        const correct1 = `${num1 + num2}`;
        const f1 = `${num1 + num2 + 2}`;
        const f2 = `${num1 + num2 - 3}`;
        addQ("Càlcul Mental", qText1, correct1, f1, f2);

        if (uniqueQuestions.length < 1000) {
          const multResult = num1 * 4;
          const qText2 = `Quant és el resultat de multiplicar ${num1} x 4?`;
          const correct2 = `${multResult}`;
          const f3 = `${multResult + 4}`;
          const f4 = `${multResult - 2}`;
          addQ("Càlcul Mental", qText2, correct2, f3, f4);
        }
      }

      // Mezclar aleatoriamente el banco entero
      for (let i = uniqueQuestions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [uniqueQuestions[i], uniqueQuestions[j]] = [uniqueQuestions[j], uniqueQuestions[i]];
      }

      return uniqueQuestions.slice(0, 1000);
    }

    let questions = generate1000Questions();
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswering = false;

    const gameScreen = document.getElementById('game-screen');
    const resultsScreen = document.getElementById('results-screen');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const categoryEl = document.getElementById('category');
    const scoreEl = document.getElementById('score');
    const progressEl = document.getElementById('progress');
    const nextBtn = document.getElementById('next-btn');

    function startGame() {
      questions = generate1000Questions();
      currentQuestionIndex = 0;
      score = 0;
      scoreEl.innerText = `Punts: ${score}`;
      resultsScreen.classList.add('hidden');
      gameScreen.style.display = 'flex';
      showQuestion();
    }

    function showQuestion() {
      isAnswering = false;
      nextBtn.classList.add('hidden');
      optionsEl.innerHTML = '';
      const q = questions[currentQuestionIndex];
      categoryEl.innerText = q.category;
      questionEl.innerText = q.question;
      progressEl.innerText = `${currentQuestionIndex + 1} / 1000`;

      const options = [...q.options].sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const button = document.createElement('button');
        button.innerText = opt;
        button.classList.add('option-btn');
        button.onclick = () => selectAnswer(button, opt, q.answer);
        optionsEl.appendChild(button);
      });
    }

    function selectAnswer(selectedBtn, selectedOpt, correctOpt) {
      if (isAnswering) return;
      isAnswering = true;

      const buttons = optionsEl.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correctOpt) {
          btn.classList.add('correct');
        }
      });

      if (selectedOpt === correctOpt) {
        score += 1;
        scoreEl.innerText = `Punts: ${score}`;
        setTimeout(() => {
          nextQuestion();
        }, 550);
      } else {
        selectedBtn.classList.add('incorrect');
        nextBtn.classList.remove('hidden');
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      gameScreen.style.display = 'none';
      resultsScreen.classList.remove('hidden');
      document.getElementById('final-score').innerText = `Has aconseguit ${score} punts de ${questions.length} possibles!`;
    }

    startGame();
  </script>
</body>
</html>
