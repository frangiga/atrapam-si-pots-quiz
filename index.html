<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entrenament - Atrapa'm si pots</title>
  <style>
    :root {
      --bg-main: #060e1a;
      --card-bg-center: #162b4d;
      --card-bg-edge: #0b172a;
      --accent-yellow: #ffd600;
      --accent-yellow-glow: rgba(255, 214, 0, 0.6);
      --accent-blue: #00b4d8;
      --accent-blue-glow: rgba(0, 180, 216, 0.5);
      --text-light: #f8f9fa;
      --text-muted: #94a3b8;
      --correct: #00e676;
      --correct-glow: rgba(0, 230, 118, 0.6);
      --incorrect: #ff1744;
      --incorrect-glow: rgba(255, 23, 68, 0.6);
      --btn-bg: rgba(23, 42, 69, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at center, #102a45 0%, #040914 100%);
      color: var(--text-light);
      height: 100dvh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 12px;
    }

    .quiz-container {
      background: radial-gradient(circle at center, var(--card-bg-center) 0%, var(--card-bg-edge) 100%);
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 780px;
      border-radius: 24px;
      box-shadow: 0 0 35px rgba(0, 180, 216, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 180, 216, 0.4);
      padding: 18px 18px 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Tercio superior con más espaciado entre elementos */
    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px; /* Aumentado el espaciado vertical */
      width: 100%;
    }

    .brand-logo {
      display: block;
      max-height: 100px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(0, 180, 216, 0.3));
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 18px;
      border-radius: 14px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }

    .score-board {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-yellow);
      text-shadow: 0 0 10px var(--accent-yellow-glow);
    }

    .progress {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Categoría con más luminosidad */
    .category-badge {
      display: inline-block;
      align-self: center;
      background: rgba(0, 180, 216, 0.2);
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      box-shadow: 0 0 15px var(--accent-blue-glow), inset 0 0 8px rgba(0, 180, 216, 0.3);
      text-shadow: 0 0 8px var(--accent-blue-glow);
      text-align: center;
    }

    .question-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 8px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-light);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* Botones de respuesta con mayor luminosidad y bordes destacados */
    .option-btn {
      background: var(--btn-bg);
      color: var(--text-light);
      border: 1px solid rgba(0, 180, 216, 0.35);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 0.95rem;
      text-align: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
      display: flex;
      align-items: center;
      min-height: 50px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 8px rgba(0, 180, 216, 0.15);
      backdrop-filter: blur(6px);
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background-color: var(--correct) !important;
      border-color: var(--correct) !important;
      color: #000 !important;
      font-weight: 800;
      box-shadow: 0 0 22px var(--correct-glow) !important;
    }

    .option-btn.incorrect {
      background-color: var(--incorrect) !important;
      border-color: var(--incorrect) !important;
      color: #fff !important;
      box-shadow: 0 0 22px var(--incorrect-glow) !important;
    }

    /* Microbotón "Següent" con brillo y luminosidad intensos */
    .next-micro-btn {
      position: absolute;
      bottom: 32px;
      right: 18px;
      background: var(--accent-yellow);
      color: #000;
      border: 1px solid #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 18px var(--accent-yellow-glow), 0 0 8px #fff;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: pulse 1.5s infinite;
      z-index: 10;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 15px var(--accent-yellow-glow); }
      50% { transform: scale(1.08); box-shadow: 0 0 25px var(--accent-yellow-glow), 0 0 12px #fff; }
      100% { transform: scale(1); box-shadow: 0 0 15px var(--accent-yellow-glow); }
    }

    .app-footer {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 10px;
      padding-top: 4px;
    }

    .app-footer a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .app-footer a:hover {
      text-decoration: underline;
    }

    .restart-btn {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 0 20px var(--accent-yellow-glow);
    }

    .hidden { display: none !important; }
    
    .results-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex: 1;
      gap: 16px;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div id="game-screen" style="display: flex; flex-direction: column; height: 100%; justify-content: space-between; position: relative;">
      
      <div class="top-section">
        <img class="brand-logo" src="https://static.apuntmedia.es/clip/da57fb20-aa5d-4c8c-92e0-cfb8d38c7949_source-aspect-ratio_360w_0.webp" alt="Atrapa'm si pots">
        
        <div class="header">
          <span class="score-board" id="score">Punts: 0</span>
          <span class="progress" id="progress">1 / 1000</span>
        </div>

        <span class="category-badge" id="category">Categoria</span>
      </div>

      <div class="question-box">
        <h2 class="question-text" id="question">Carregant...</h2>
      </div>
      
      <div class="options-grid" id="options"></div>

      <button id="next-btn" class="next-micro-btn hidden" onclick="nextQuestion()">
        Següent ➔
      </button>

      <footer class="app-footer">
        Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
      </footer>
    </div>

    <div id="results-screen" class="results-screen hidden">
      <h2 style="color: var(--accent-yellow); font-size: 1.8rem; text-shadow: 0 0 15px var(--accent-yellow-glow);">Entrenament Finalitzat! 🎉</h2>
      <p id="final-score" style="font-size: 1.2rem; color: var(--text-light);"></p>
      <button class="restart-btn" onclick="startGame()">Tornar a començar</button>
      
      <footer class="app-footer" style="margin-top: 20px;">
        Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
      </footer>
    </div>
  </div>

  <script>
    function generate1000Questions() {
      const dbAutonomica = [];
      const dbGeneral = [];

      const comarques = [
        { nom: "La Marina Alta", cap: "Dénia" }, { nom: "La Marina Baixa", cap: "La Vila Joiosa" },
        { nom: "La Safor", cap: "Gandia" }, { nom: "La Ribera Alta", cap: "Alzira" },
        { nom: "La Ribera Baixa", cap: "Sueca" }, { nom: "L'Alcoià", cap: "Alcoi" },
        { nom: "El Comtat", cap: "Cocentaina" }, { nom: "L'Alt Maestrat", cap: "Albocàsser" },
        { nom: "El Baix Maestrat", cap: "Vinaròs" }, { nom: "La Plana Alta", cap: "Castelló de la Plana" },
        { nom: "La Plana Baixa", cap: "Borriana" }, { nom: "El Camp de Morvedre", cap: "Sagunt" },
        { nom: "El Camp de Túria", cap: "Llíria" }, { nom: "L'Horta Nord", cap: "Puçol" },
        { nom: "L'Horta Sud", cap: "Torrent" }, { nom: "La Vall d'Albaida", cap: "Ontinyent" },
        { nom: "El Baix Vinalopó", cap: "Elx" }, { nom: "L'Alt Vinalopó", cap: "Villena" },
        { nom: "El Vinalopó Mitjà", cap: "Elda" }, { nom: "La Vega Baixa", cap: "Oriola" },
        { nom: "Els Ports", cap: "Morella" }, { nom: "L'Alt Palància", cap: "Sogorb" }
      ];

      const valencianaFixes = [
        { category: "Cultura Valenciana", question: "Quin monument gòtic civil de València és Patrimoni de la Humanitat?", options: ["La Llotja de la Seda", "Torres de Serrans", "El Micalet"], answer: "La Llotja de la Seda" },
        { category: "Geografia Valenciana", question: "Quin és el punt més alt de la Comunitat Valenciana?", options: ["El Calderón", "Penyagolosa", "Aitana"], answer: "El Calderón" },
        { category: "Festes i Tradicions", question: "En quina ciutat se celebra el famós Misteri medieval?", options: ["Elx", "Oriola", "Castelló"], answer: "Elx" },
        { category: "Gastronomia Valenciana", question: "Quin ingredient és la base tradicional de l'orxata?", options: ["Xufa", "Ametlla", "Arròs"], answer: "Xufa" },
        { category: "Història Valenciana", question: "En quin any va entrar Jaume I a la ciutat de València?", options: ["1238", "1492", "1707"], answer: "1238" },
        { category: "Art i Literatura Valenciana", question: "Qui és l'autor de la meua obra clàssica 'Tirant lo Blanch'?", options: ["Joanot Martorell", "Ausiàs March", "Jordi de Sant Jordi"], answer: "Joanot Martorell" },
        { category: "Festes i Tradicions", question: "A quina localitat se celebra 'La Tomatina'?", options: ["Buñol", "Xàtiva", "Morella"], answer: "Buñol" },
        { category: "Geografia Valenciana", question: "Quina illa habitada es troba davant de Santa Pola?", options: ["Tabarca", "Columbrets", "Benidorm"], answer: "Tabarca" },
        { category: "Art i Literatura Valenciana", question: "Quin pintor valencià destaca per la seua llum i escenes de platja?", options: ["Joaquim Sorolla", "Josep de Ribera", "Ignasi Pinazo"], answer: "Joaquim Sorolla" },
        { category: "Música i Festa", question: "Qui va composar el 'Concierto de Aranjuez', nascut a Sagunt?", options: ["Joaquín Rodrigo", "Vicent Martín i Soler", "Ruperto Chapí"], answer: "Joaquín Rodrigo" },
        { category: "Natura Valenciana", question: "Quin d'aquests paratges és una llaguna d'aigua dolça molt propera a València?", options: ["L'Albufera", "El Prat de Cabanes", "Las Salinas de Torrevieja"], answer: "L'Albufera" },
        { category: "Història Valenciana", question: "Quina va ser la data d'abolició dels Furs Valencians?", options: ["1707", "1808", "1936"], answer: "1707" },
        { category: "Gastronomia Valenciana", question: "Quin plat típic valencià es prepara tradicionalment amb pa dur, oli i all?", options: ["Les Infernals", "Les Miques", "L'Esgarraet"], answer: "L'Esgarraet" },
        { category: "Natura Valenciana", question: "Quin parc natural es troba entre la Marina Baixa i l'Alcoià?", options: ["Font Roja", "Serra Gelada", "Serra de Mariola"], answer: "Serra de Mariola" }
      ];

      dbAutonomica.push(...valencianaFixes);

      comarques.forEach(c => {
        const alt1 = comarques[(comarques.indexOf(c) + 1) % comarques.length].cap;
        const alt2 = comarques[(comarques.indexOf(c) + 2) % comarques.length].cap;
        dbAutonomica.push({
          category: "Geografia Valenciana",
          question: `Quina és la capital de la comarca de ${c.nom}?`,
          options: [c.cap, alt1, alt2],
          answer: c.cap
        });
        dbAutonomica.push({
          category: "Geografia Valenciana",
          question: `A quina comarca pertany el municipi de ${c.cap}?`,
          options: [c.nom, comarques[(comarques.indexOf(c) + 3) % comarques.length].nom, comarques[(comarques.indexOf(c) + 4) % comarques.length].nom],
          answer: c.nom
        });
      });

      while(dbAutonomica.length < 300) {
        dbAutonomica.push(...valencianaFixes);
      }

      const capitalsMon = [
        { pais: "França", cap: "París", f1: "Lió", f2: "Marsella" },
        { pais: "Itàlia", cap: "Roma", f1: "Milà", f2: "Nàpols" },
        { pais: "Alemanya", cap: "Berlín", f1: "Múnic", f2: "Frankfurt" },
        { pais: "Japó", cap: "Tòquio", f1: "Kioto", f2: "Osaka" },
        { pais: "Portugal", cap: "Lisboa", f1: "Porto", f2: "Coïmbra" },
        { pais: "Regne Unit", cap: "Londres", f1: "Manchester", f2: "Liverpool" },
        { pais: "Grècia", cap: "Atenes", f1: "Salònica", f2: "Heràclion" },
        { pais: "Egipte", cap: "El Caire", f1: "Alexandria", f2: "Gizeh" },
        { pais: "Austràlia", cap: "Canberra", f1: "Sydney", f2: "Melbourne" },
        { pais: "Canadà", cap: "Ottawa", f1: "Toronto", f2: "Vancouver" },
        { pais: "Brasil", cap: "Brasília", f1: "Rio de Janeiro", f2: "São Paulo" },
        { pais: "Argentina", cap: "Buenos Aires", f1: "Mendoza", f2: "Rosario" },
        { pais: "Mèxic", cap: "Ciutat de Mèxic", f1: "Guadalajara", f2: "Monterrey" }
      ];

      const culturaGeneralFixes = [
        { category: "Ciència i Natura", question: "Quin és el planeta més gran del Sistema Solar?", options: ["Júpiter", "Saturn", "Neptú"], answer: "Júpiter" },
        { category: "Història Universal", question: "En quin any va arribar Cristòfor Colom a Amèrica?", options: ["1492", "1508", "1485"], answer: "1492" },
        { category: "Cine i Cinema", question: "Quin director va dirigir la pel·lícula 'Jurassic Park'?", options: ["Steven Spielberg", "George Lucas", "James Cameron"], answer: "Steven Spielberg" },
        { category: "Literatura Universal", question: "Qui va escriure 'Don Quijote de la Mancha'?", options: ["Miguel de Cervantes", "Lope de Vega", "Calderón de la Barca"], answer: "Miguel de Cervantes" },
        { category: "Art i Pintura", question: "En quin museu es troba el quadre de 'La Gioconda' (Mona Lisa)?", options: ["Museu del Louvre", "Museu del Prado", "British Museum"], answer: "Museu del Louvre" },
        { category: "Ciència i Natura", question: "Quin és l'element químic amb el símbol 'O'?", options: ["Oxigen", "Or", "Osmi"], answer: "Oxigen" },
        { category: "Història Universal", question: "Quina cultura antiga va construir les piràmides de Gizeh?", options: ["Egípcia", "Romana", "Grega"], answer: "Egípcia" },
        { category: "Música i Espectacle", question: "Quin grup britànic va publicar l'àlbum 'Abbey Road'?", options: ["The Beatles", "The Rolling Stones", "Queen"], answer: "The Beatles" },
        { category: "Geografia Mundial", question: "Quin és el riu més llarg del món?", options: ["Amazones", "Nil", "Mississipí"], answer: "Amazones" },
        { category: "Ciència i Natura", question: "Quants ossos té el cos humà adult?", options: ["206", "185", "300"], answer: "206" },
        { category: "Esports", question: "Cada quants anys se celebren els Jocs Olímpics d'Estiu?", options: ["4 anys", "2 anys", "5 anys"], answer: "4 anys" },
        { category: "Cine i Cinema", question: "Quina pel·lícula va guanyar l'Oscar a la Millor Pel·lícula el 1997 ambientada en un vaixell?", options: ["Titanic", "Avatar", "Gladiator"], answer: "Titanic" }
      ];

      dbGeneral.push(...culturaGeneralFixes);

      capitalsMon.forEach(c => {
        dbGeneral.push({
          category: "Geografia Mundial",
          question: `Quina és la capital de ${c.pais}?`,
          options: [c.cap, c.f1, c.f2],
          answer: c.cap
        });
      });

      while(dbGeneral.length < 700) {
        dbGeneral.push(...culturaGeneralFixes);
      }

      const finalDB = [...dbAutonomica.slice(0, 300), ...dbGeneral.slice(0, 700)];

      for (let i = finalDB.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [finalDB[i], finalDB[j]] = [finalDB[j], finalDB[i]];
      }

      return finalDB;
    }

    let questions = generate1000Questions();
    let currentQuestionIndex = 0;
    let score = 0;
    let isAnswering = false;

    const gameScreen = document.getElementById('game-screen');
    const resultsScreen = document.getElementById('results-screen');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const categoryEl = document.getElementById('category');
    const scoreEl = document.getElementById('score');
    const progressEl = document.getElementById('progress');
    const nextBtn = document.getElementById('next-btn');

    function startGame() {
      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
      }
      currentQuestionIndex = 0;
      score = 0;
      scoreEl.innerText = `Punts: ${score}`;
      resultsScreen.classList.add('hidden');
      gameScreen.style.display = 'flex';
      showQuestion();
    }

    function showQuestion() {
      isAnswering = false;
      nextBtn.classList.add('hidden');
      optionsEl.innerHTML = '';
      const q = questions[currentQuestionIndex];
      categoryEl.innerText = q.category;
      questionEl.innerText = q.question;
      progressEl.innerText = `${currentQuestionIndex + 1} / 1000`;

      const options = [...q.options].sort(() => Math.random() - 0.5);

      options.forEach(opt => {
        const button = document.createElement('button');
        button.innerText = opt;
        button.classList.add('option-btn');
        button.onclick = () => selectAnswer(button, opt, q.answer);
        optionsEl.appendChild(button);
      });
    }

    function selectAnswer(selectedBtn, selectedOpt, correctOpt) {
      if (isAnswering) return;
      isAnswering = true;

      const buttons = optionsEl.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correctOpt) {
          btn.classList.add('correct');
        }
      });

      if (selectedOpt === correctOpt) {
        score += 1;
        scoreEl.innerText = `Punts: ${score}`;
        setTimeout(() => {
          nextQuestion();
        }, 550);
      } else {
        selectedBtn.classList.add('incorrect');
        nextBtn.classList.remove('hidden');
      }
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        endGame();
      }
    }

    function endGame() {
      gameScreen.style.display = 'none';
      resultsScreen.classList.remove('hidden');
      document.getElementById('final-score').innerText = `Has aconseguit ${score} punts de ${questions.length} possibles!`;
    }

    startGame();
  </script>
</body>
</html>
