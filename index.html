<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Entrenament - Atrapa'm si pots</title>
<style>
:root {
  --bg-main: #060e1a;
  --card-bg-center: #162b4d;
  --card-bg-edge: #0b172a;
  --accent-yellow: #ffd600;
  --accent-yellow-glow: rgba(255, 214, 0, 0.6);
  --accent-blue: #00b4d8;
  --accent-blue-glow: rgba(0, 180, 216, 0.5);
  --text-light: #f8f9fa;
  --text-muted: #94a3b8;
  --correct: #00e676;
  --correct-glow: rgba(0, 230, 118, 0.6);
  --incorrect: #ff1744;
  --incorrect-glow: rgba(255, 23, 68, 0.6);
  --btn-bg: rgba(23, 42, 69, 0.85);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }
body {
  background-color: var(--bg-main);
  background-image: radial-gradient(circle at center, #102a45 0%, #040914 100%);
  color: var(--text-light);
  height: 100dvh;
  width: 100vw;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  padding: 12px;
}
.quiz-container {
  background: radial-gradient(circle at center, var(--card-bg-center) 0%, var(--card-bg-edge) 100%);
  width: 100%;
  max-width: 480px;
  height: 100%;
  max-height: 780px;
  border-radius: 24px;
  box-shadow: 0 0 35px rgba(0, 180, 216, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(0, 180, 216, 0.4);
  padding: 18px 18px 12px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}
.top-section { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.brand-logo { display: block; max-height: 90px; width: auto; object-fit: contain; filter: drop-shadow(0 0 12px rgba(0, 180, 216, 0.3)); }
.header { display: flex; justify-content: space-between; align-items: center; width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); padding: 8px 16px; border-radius: 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
.score-board { font-weight: 700; font-size: 1rem; color: var(--accent-yellow); text-shadow: 0 0 10px var(--accent-yellow-glow); }
.progress { font-weight: 600; font-size: 0.85rem; color: var(--text-muted); }
.category-badge { display: inline-block; align-self: center; background: rgba(0, 180, 216, 0.2); color: #38bdf8; border: 1.5px solid #38bdf8; padding: 6px 18px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; box-shadow: 0 0 15px var(--accent-blue-glow), inset 0 0 8px rgba(0, 180, 216, 0.3); text-shadow: 0 0 8px var(--accent-blue-glow); text-align: center; }
.question-box { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 6px; }
.question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.35; color: var(--text-light); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

.next-micro-btn {
  align-self: center;
  margin: 6px 0 10px 0;
  background: var(--accent-yellow);
  color: #000;
  border: 1px solid #fff;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 0 18px var(--accent-yellow-glow), 0 0 8px #fff;
  display: flex;
  align-items: center;
  gap: 6px;
  animation: pulse 1.5s infinite;
  z-index: 5;
}
@keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 15px var(--accent-yellow-glow); } 50% { transform: scale(1.05); box-shadow: 0 0 25px var(--accent-yellow-glow), 0 0 12px #fff; } 100% { transform: scale(1); box-shadow: 0 0 15px var(--accent-yellow-glow); } }

.options-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.option-btn { background: var(--btn-bg); color: var(--text-light); border: 1px solid rgba(0, 180, 216, 0.35); border-radius: 14px; padding: 12px 16px; font-size: 0.95rem; text-align: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; font-weight: 600; display: flex; align-items: center; min-height: 48px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 8px rgba(0, 180, 216, 0.15); backdrop-filter: blur(6px); }
.option-btn:active { transform: scale(0.98); }
.option-btn.correct { background-color: var(--correct) !important; border-color: var(--correct) !important; color: #000 !important; font-weight: 800; box-shadow: 0 0 22px var(--correct-glow) !important; }
.option-btn.incorrect { background-color: var(--incorrect) !important; border-color: var(--incorrect) !important; color: #fff !important; box-shadow: 0 0 22px var(--incorrect-glow) !important; }

.app-footer { text-align: center; font-size: 0.72rem; color: var(--text-muted); margin-top: 10px; padding-top: 4px; }
.app-footer a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
.app-footer a:hover { text-decoration: underline; }
.restart-btn { background-color: var(--accent-yellow); color: #000; border: none; padding: 16px; border-radius: 14px; font-size: 1.05rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 0 0 20px var(--accent-yellow-glow); }
.hidden { display: none !important; }
.results-screen { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; gap: 16px; }
</style>
</head>
<body>

<div class="quiz-container">
  <div id="game-screen" style="display: flex; flex-direction: column; height: 100%; justify-content: space-between;">
    <div class="top-section">
      <img class="brand-logo" src="https://static.apuntmedia.es/clip/da57fb20-aa5d-4c8c-92e0-cfb8d38c7949_source-aspect-ratio_360w_0.webp" alt="Atrapa'm si pots">
      <div class="header">
        <span class="score-board" id="score">Punts: 0</span>
        <span class="progress" id="progress">1 / 500</span>
      </div>
      <span class="category-badge" id="category">Categoria</span>
    </div>

    <div class="question-box">
      <h2 class="question-text" id="question">Carregant...</h2>
    </div>

    <button id="next-btn" class="next-micro-btn hidden" onclick="nextQuestion()">Següent ➔</button>

    <div class="options-grid" id="options"></div>

    <footer class="app-footer">
      Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
    </footer>
  </div>

  <div id="results-screen" class="results-screen hidden">
    <h2 style="color: var(--accent-yellow); font-size: 1.8rem; text-shadow: 0 0 15px var(--accent-yellow-glow);">Entrenament Finalitzat! 🎉</h2>
    <p id="final-score" style="font-size: 1.2rem; color: var(--text-light);"></p>
    <button class="restart-btn" onclick="startGame()">Tornar a començar</button>
    <footer class="app-footer" style="margin-top: 20px;">
      Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a>
    </footer>
  </div>
</div>

<script>
function generate500Questions() {
  const baseQuestions = [];

  function addQ(cat, qText, correctOpt, false1, false2) {
    if (correctOpt && false1 && false2) {
      baseQuestions.push({
        category: cat,
        question: qText,
        options: [correctOpt, false1, false2],
        answer: correctOpt
      });
    }
  }

  // 1. REGIONAL: Comarcas
  const comarquesFull = [
    { nom: "La Marina Alta", cap: "Dénia", prov: "Alacant" },
    { nom: "La Marina Baixa", cap: "La Vila Joiosa", prov: "Alacant" },
    { nom: "La Safor", cap: "Gandia", prov: "València" },
    { nom: "La Ribera Alta", cap: "Alzira", prov: "València" },
    { nom: "La Ribera Baixa", cap: "Sueca", prov: "València" },
    { nom: "L'Alcoià", cap: "Alcoi", prov: "Alacant" },
    { nom: "El Comtat", cap: "Cocentaina", prov: "Alacant" },
    { nom: "L'Alt Maestrat", cap: "Albocàsser", prov: "Castelló" },
    { nom: "El Baix Maestrat", cap: "Vinaròs", prov: "Castelló" },
    { nom: "La Plana Alta", cap: "Castelló de la Plana", prov: "Castelló" },
    { nom: "La Plana Baixa", cap: "Borriana", prov: "Castelló" },
    { nom: "El Camp de Morvedre", cap: "Sagunt", prov: "València" },
    { nom: "El Camp de Túria", cap: "Llíria", prov: "València" },
    { nom: "L'Horta Nord", cap: "Puçol", prov: "València" },
    { nom: "L'Horta Sud", cap: "Torrent", prov: "València" },
    { nom: "La Vall d'Albaida", cap: "Ontinyent", prov: "València" },
    { nom: "El Baix Vinalopó", cap: "Elx", prov: "Alacant" },
    { nom: "L'Alt Vinalopó", cap: "Villena", prov: "Alacant" },
    { nom: "El Vinalopó Mitjà", cap: "Elda", prov: "Alacant" },
    { nom: "La Vega Baixa", cap: "Oriola", prov: "Alacant" },
    { nom: "Els Ports", cap: "Morella", prov: "Castelló" },
    { nom: "L'Alt Palància", cap: "Sogorb", prov: "Castelló" },
    { nom: "La Foia de Bunyol", cap: "Bunyol", prov: "València" },
    { nom: "El Valle de Ayora-Cofrentes", cap: "Aiora", prov: "València" },
    { nom: "La Canal de Navarrés", cap: "Enguera", prov: "València" },
    { nom: "La Costera", cap: "Xàtiva", prov: "València" },
    { nom: "Els Serrans", cap: "Xelva", prov: "València" },
    { nom: "L'Alt Millars", cap: "Cirats", prov: "Castelló" },
    { nom: "L'Alcalatén", cap: "L'Alcora", prov: "Castelló" },
    { nom: "La Plana d'Utiel-Requena", cap: "Requena", prov: "València" },
    { nom: "L'Rincón de Ademuz", cap: "Ademuz", prov: "València" },
    { nom: "València City", cap: "València", prov: "València" },
    { nom: "Alacantí", cap: "Alacant", prov: "Alacant" }
  ];

  comarquesFull.forEach((c, idx) => {
    const c1 = comarquesFull[(idx + 1) % comarquesFull.length];
    const c2 = comarquesFull[(idx + 2) % comarquesFull.length];
    addQ("Geografia Valenciana", `Quina és la capital de la comarca de ${c.nom}?`, c.cap, c1.cap, c2.cap);
    addQ("Geografia Valenciana", `A quina comarca pertany el municipi de ${c.cap}?`, c.nom, c1.nom, c2.nom);
    const altProvs = ["València", "Alacant", "Castelló"].filter(p => p !== c.prov);
    addQ("Geografia Valenciana", `En quina província es troba la comarca de ${c.nom}?`, c.prov, altProvs[0], altProvs[1]);
  });

  // 2. REGIONAL: Música
  const grupsMusica = [
    { grup: "La Gossa Sorda", origen: "Pego", canco: "Camals mullats", disco: "Saó" },
    { grup: "Zoo", origen: "Gandia", canco: "Tobogan", disco: "Llepolies" },
    { grup: "Aspencat", origen: "Xaló", canco: "La distància", disco: "Essència" },
    { grup: "La Fúmiga", origen: "Alzira", canco: "Mediterrània", disco: "Espremedors" },
    { grup: "El Diluvi", origen: "Alcoi", canco: "Alegria", disco: "Juguem a deure'ns" },
    { grup: "Auxili", origen: "Ontinyent", canco: "Hui la liem", disco: "Instants del temps" },
    { grup: "Smoking Souls", origen: "Pego", canco: "1632", disco: "Cendra i or" },
    { grup: "Al Tall", origen: "València", canco: "Tio Canya", disco: "Quan el Mal Ve de Almansa" },
    { grup: "Obrint Pas", origen: "València", canco: "La flama", disco: "Benvingut al paradís" },
    { grup: "Tardor", origen: "València", canco: "El cel rogent", disco: "Patraix" },
    { grup: "Gener", origen: "Carcaixent", canco: "Cugat", disco: "Oh germans!" },
    { grup: "Ciudad Jara", origen: "Gandia", canco: "Bailar con las olas", disco: "Donde nace el infarto" },
    { grup: "Orxata Sound System", origen: "València", canco: "Niça muke", disco: "1.0" },
    { grup: "Sva-ters", origen: "Alcàsser", canco: "Romanç de cego", disco: "Berlanga" },
    { grup: "Xavi Sarrià", origen: "Almassora", canco: "No s'apaga la flama", disco: "Amb l'esperança entre les dents" },
    { grup: "Raimon", origen: "Xàtiva", canco: "Al vent", disco: "A Alcoi" },
    { grup: "Ebri Knight", origen: "Maresme", canco: "Guerrilla", disco: "Vora el foc" },
    { grup: "Pau Alabajos", origen: "Torrent", canco: "Zapping", disco: "Teoria del caos" },
    { grup: "Miquel Gil", origen: "Catarroja", canco: "ELS VENTS", disco: "Katà" },
    { grup: "Nino Bravo", origen: "Aielo de Malferit", canco: "Un beso y una flor", disco: "América" },
    { grup: "Camilo Sesto", origen: "Alcoi", canco: "Vivir así es morir de amor", disco: "Sentimientos" }
  ];

  grupsMusica.forEach((g, idx) => {
    const g1 = grupsMusica[(idx + 1) % grupsMusica.length];
    const g2 = grupsMusica[(idx + 2) % grupsMusica.length];
    addQ("Música Valenciana", `De quina localitat és originari el grup o artista '${g.grup}'?`, g.origen, g1.origen, g2.origen);
    addQ("Música Valenciana", `Quina d'aquestes cançons és un tema de '${g.grup}'?`, g.canco, g1.canco, g2.canco);
    addQ("Música Valenciana", `Quin d'aquests treballs és un àlbum de '${g.grup}'?`, g.disco, g1.disco, g2.disco);
  });

  // 3. REGIONAL: Cultura general
  const regionalMisc = [
    { cat: "Cultura Valenciana", q: "Quin monument gòtic civil de València és Patrimoni de la Humanitat?", a: "La Llotja de la Seda", f1: "Torres de Serrans", f2: "El Micalet" },
    { cat: "Geografia Valenciana", q: "Quin és el punt més alt geogràfic de la Comunitat Valenciana?", a: "El Calderón", f1: "Penyagolosa", f2: "Aitana" },
    { cat: "Festes i Tradicions", q: "En quina ciutat se celebra el famós Misteri d'origen medieval?", a: "Elx", f1: "Oriola", f2: "Castelló" },
    { cat: "Gastronomia Valenciana", q: "Quin ingredient és la base principal tradicional de l'orxata?", a: "Xufa", f1: "Ametlla", f2: "Arròs" },
    { cat: "Història Valenciana", q: "En quin any va entrar oficialment Jaume I a la ciutat de València?", a: "1238", f1: "1492", f2: "1707" },
    { cat: "Art i Literatura", q: "Qui és l'autor de la gran obra clàssica 'Tirant lo Blanch'?", a: "Joanot Martorell", f1: "Ausiàs March", f2: "Jordi de Sant Jordi" },
    { cat: "Festes i Tradicions", q: "A quina localitat de la Foia de Bunyol se celebra 'La Tomatina'?", a: "Buñol", f1: "Xàtiva", f2: "Morella" },
    { cat: "Geografia Valenciana", q: "Quina illa habitada es troba davant de les costes de Santa Pola?", a: "Tabarca", f1: "Columbrets", f2: "Benidorm" },
    { cat: "Art i Pintura", q: "Quin pintor valencià destaca per la seua llum i escenes de la mar?", a: "Joaquim Sorolla", f1: "Josep de Ribera", f2: "Ignasi Pinazo" },
    { cat: "Música Clàssica", q: "Qui va composar el 'Concierto de Aranjuez', sent natural de Sagunt?", a: "Joaquín Rodrigo", f1: "Vicent Martín i Soler", f2: "Ruperto Chapí" },
    { cat: "Natura Valenciana", q: "Quin d'aquestes paratges és una gran llaguna d'aigua dolça a València?", a: "L'Albufera", f1: "El Prat de Cabanes", f2: "Salinas de Torrevieja" },
    { cat: "Història Valenciana", q: "Quina va ser la data de la Batalla d'Almansa i abolició dels Furs?", a: "1707", f1: "1808", f2: "1936" },
    { cat: "Geografia Valenciana", q: "Quin riu desemboca principalment a la ciutat de Cullera?", a: "Xúquer", f1: "Túria", f2: "Segura" },
    { cat: "Geografia Valenciana", q: "Quin riu creua la ciutat de València reconvertit en un gran parc urbà?", a: "Túria", f1: "Xúquer", f2: "Vinalopó" },
    { cat: "Literatura Valenciana", q: "Quin poeta de Beniarjó és el màxim exponent del Segle d'Or de la poesia valenciana?", a: "Ausiàs March", f1: "Joan Roís de Corella", f2: "Jaume Roig" },
    { cat: "Festes i Tradicions", q: "En quina data se celebra oficialment la Diada del Poble Valencià?", a: "9 d'Octubre", f1: "19 de Març", f2: "24 de Juny" },
    { cat: "Festes i Tradicions", q: "Quin nom rep la Nit del 19 de Març quan es cremen els monuments fallers?", a: "La Cremà", f1: "La Nit del Foc", f2: "La Plantà" },
    { cat: "Festes i Tradicions", q: "Com anomenen popularment l'acte on es dispara una gran traca sorollosa a les 14:00h?", a: "Mascletà", f1: "Despertà", f2: "Nit del Foc" },
    { cat: "Història Valenciana", q: "Quin rei va fundar el Regne de València al segle XIII?", a: "Jaume I el Conqueridor", f1: "Pere el Gran", f2: "Alfons el Magnànim" },
    { cat: "Geografia Valenciana", q: "Quin parc natural marítim-terrestre es troba situat a la comarca de la Marina Baixa?", a: "Serra Gelada", f1: "El Montgó", f2: "Serra Espadà" },
    { cat: "Patrimoni Valencianista", q: "En quina localitat trobem el famós Castell de Santa Bàrbara?", a: "Alacant", f1: "Xàtiva", f2: "Morella" },
    { cat: "Patrimoni Valencianista", q: "Quin municipi és famós pel seu Castell situat dalt d'una mola rocosa als Ports?", a: "Morella", f1: "Vilafamés", f2: "Ares del Maestrat" },
    { cat: "Natura Valenciana", q: "Quin massís muntanyós separa les comarques de la Marina Alta i la Safor?", a: "El Montgó", f1: "Penyagolosa", f2: "Benicadell" }
  ];
  regionalMisc.forEach(d => addQ(d.cat, d.q, d.a, d.f1, d.f2));

  // 4. GENERAL: Capitals del Món
  const capitalsWorld = [
    { pais: "França", cap: "París" }, { pais: "Itàlia", cap: "Roma" }, { pais: "Alemanya", cap: "Berlín" },
    { pais: "Japó", cap: "Tòquio" }, { pais: "Portugal", cap: "Lisboa" }, { pais: "Regne Unit", cap: "Londres" },
    { pais: "Grècia", cap: "Atenes" }, { pais: "Egipte", cap: "El Caire" }, { pais: "Austràlia", cap: "Canberra" },
    { pais: "Canadà", cap: "Ottawa" }, { pais: "Brasil", cap: "Brasília" }, { pais: "Argentina", cap: "Buenos Aires" },
    { pais: "Mèxic", cap: "Ciutat de Mèxic" }, { pais: "Suïssa", cap: "Berna" }, { pais: "Bèlgica", cap: "Brussel·les" },
    { pais: "Països Baixos", cap: "Amsterdam" }, { pais: "Suècia", cap: "Estocolm" }, { pais: "Noruega", cap: "Oslo" },
    { pais: "Finlàndia", cap: "Hèlsinki" }, { pais: "Polònia", cap: "Varsòvia" }, { pais: "Àustria", cap: "Viena" },
    { pais: "Irlanda", cap: "Dublín" }, { pais: "Xina", cap: "Pequín" }, { pais: "Índia", cap: "Nova Delhi" },
    { pais: "Corea del Sud", cap: "Seül" }, { pais: "Rússia", cap: "Moscou" }, { pais: "Turquia", cap: "Ankara" },
    { pais: "Marroc", cap: "Rabat" }, { pais: "Colòmbia", cap: "Bogotà" }, { pais: "Xile", cap: "Santiago" },
    { pais: "Perú", cap: "Lima" }, { pais: "Estats Units", cap: "Washington D.C." }
  ];

  capitalsWorld.forEach((c, idx) => {
    const c1 = capitalsWorld[(idx + 1) % capitalsWorld.length];
    const c2 = capitalsWorld[(idx + 2) % capitalsWorld.length];
    addQ("Geografia Mundial", `Quina és la capital oficial de ${c.pais}?`, c.cap, c1.cap, c2.cap);
    addQ("Geografia Mundial", `De quin país és capital la ciutat de ${c.cap}?`, c.pais, c1.pais, c2.pais);
  });

  // 5. GENERAL: Varios
  const generalMisc = [
    { cat: "Ciència i Natura", q: "Quin és el planeta de major grandària de tot el Sistema Solar?", a: "Júpiter", f1: "Saturn", f2: "Neptú" },
    { cat: "Història Universal", q: "En quin any va arribar per primera vegada Cristòfor Colom a Amèrica?", a: "1492", f1: "1508", f2: "1485" },
    { cat: "Cinema", q: "Quin director de cinema va dirigir la pel·lícula 'Jurassic Park'?", a: "Steven Spielberg", f1: "George Lucas", f2: "James Cameron" },
    { cat: "Literatura Universal", q: "Qui va escriure la cèlebre obra 'Don Quijote de la Mancha'?", a: "Miguel de Cervantes", f1: "Lope de Vega", f2: "Calderón de la Barca" },
    { cat: "Art i Pintura", q: "En quin famós museu es troba el quadre de 'La Gioconda'?", a: "Museu del Louvre", f1: "Museu del Prado", f2: "British Museum" },
    { cat: "Ciència i Natura", q: "Quin és l'element químic simbolitzat amb la lletra 'O'?", a: "Oxigen", f1: "Or", f2: "Osmi" },
    { cat: "Història Universal", q: "Quina civilització antiga va construir les piràmides de Gizeh?", a: "Egípcia", f1: "Romana", f2: "Grega" },
    { cat: "Música Internacional", q: "Quin grup britànic va publicar l'àlbum musical 'Abbey Road'?", a: "The Beatles", f1: "The Rolling Stones", f2: "Queen" },
    { cat: "Geografia Mundial", q: "Quin és considerat el riu més llarg i cabalós del món?", a: "Amazones", f1: "Nil", f2: "Mississipí" },
    { cat: "Anatomia Humana", q: "Quants ossos té aproximadament el cos humà adult?", a: "206", f1: "185", f2: "300" },
    { cat: "Esports", q: "Cada quants anys se celebren habitualment els Jocs Olímpics d'Estiu?", a: "4 anys", f1: "2 anys", f2: "5 anys" },
    { cat: "Art i Pintura", q: "Qui va pintar la volta de la Capella Sixtina al Vaticà?", a: "Miquel Àngel", f1: "Leonardo da Vinci", f2: "Rafael" },
    { cat: "Història Universal", q: "En quin any va finalitzar la Segona Guerra Mundial?", a: "1945", f1: "1939", f2: "1918" },
    { cat: "Ciència i Natura", q: "Quin és el metall més abundant en la crosta terrestre?", a: "Alumini", f1: "Ferro", f2: "Cobre" },
    { cat: "Literatura Universal", q: "Qui va escriure la tragèdia 'Romeu i Julieta'?", a: "William Shakespeare", f1: "Charles Dickens", f2: "Victor Hugo" },
    { cat: "Geografia Mundial", q: "Quina és la serralada més alta del món?", a: "Himàlaia", f1: "Andes", f2: "Alps" },
    { cat: "Cinema", q: "Quina pel·lícula va guanyar l'Òscar a millor pel·lícula l'any 1997 dirigida per James Cameron?", a: "Titanic", f1: "Avatar", f2: "Gladiator" },
    { cat: "Història Universal", q: "Quin va ser el primer emperador de l'Imperi Romà?", a: "August", f1: "Juli Cèsar", f2: "Neró" },
    { cat: "Ciència i Natura", q: "Quin òrgan del cos humà produeix la insulina?", a: "Pàncrees", f1: "Fetge", f2: "Ronyó" },
    { cat: "Música Internacional", q: "Quin compositor clàssic va escriure la 'Cinquena Simfonia' sent sord?", a: "Beethoven", f1: "Mozart", f2: "Bach" },
    { cat: "Literatura Universal", q: "Quin autor és el creador del famós detectiu Sherlock Holmes?", a: "Arthur Conan Doyle", f1: "Agatha Christie", f2: "Edgar Allan Poe" },
    { cat: "Art i Pintura", q: "Quin pintor neerlandés va pintar el famós quadre 'La nit estelada'?", a: "Vincent van Gogh", f1: "Rembrandt", f2: "Monet" },
    { cat: "Geografia Mundial", q: "Quin és l'oceà més gran de la Terra?", a: "Pacífic", f1: "Atlàntic", f2: "Índic" },
    { cat: "Història Universal", q: "En quin any va caure el Mur de Berlín marcant la fi de la Guerra Freda?", a: "1989", f1: "1975", f2: "1991" },
    { cat: "Ciència i Natura", q: "Quina velocitat té aproximadament la llum al buit?", a: "300.000 km/s", f1: "150.000 km/s", f2: "1.000.000 km/s" },
    { cat: "Astronomia", q: "Quin és el planeta més proper al Sol?", a: "Mercuri", f1: "Venus", f2: "Mart" },
    { cat: "Esports", q: "Quants jugadors formen un equip de bàsquet a la pista durant un partit?", a: "5 jugadors", f1: "6 jugadors", f2: "7 jugadors" },
    { cat: "Literatura Universal", q: "Quina és l'obra poètica de l'antiga Grècia atribüida a Homer que narra el viatge d'Ulisses?", a: "L'Odissea", f1: "La Ilíada", f2: "L'Eneida" },
    { cat: "Cinema", q: "Quin actor va interpretar el personatge d'Indiana Jones?", a: "Harrison Ford", f1: "Mel Gibson", f2: "Tom Cruise" },
    { cat: "Geografia Mundial", q: "Quin és el desert càlid més gran del món?", a: "Sàhara", f1: "Gobi", f2: "Atacama" },
    { cat: "Música Internacional", q: "Quin cantant era conegut popularment com el 'Rei del Pop'?", a: "Michael Jackson", f1: "Elvis Presley", f2: "Freddie Mercury" },
    { cat: "Història Universal", q: "Quina revolució va començar l'any 1789 amb la presa de la Bastilla?", a: "Revolució Francesa", f1: "Revolució Russa", f2: "Revolució Industrial" }
  ];
  generalMisc.forEach(d => addQ(d.cat, d.q, d.a, d.f1, d.f2));

  // ==========================================
  // GENERADOR GARANTIZADO DE 500 PREGUNTAS
  // ==========================================
  // Barajar array base
  const shuffledBase = [...baseQuestions];
  for (let i = shuffledBase.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledBase[i], shuffledBase[j]] = [shuffledBase[j], shuffledBase[i]];
  }

  const result500 = [];
  let index = 0;
  
  // Bucle infinito controlado hasta alcanzar EXACTAMENTE 500
  while (result500.length < 500) {
    const originalItem = shuffledBase[index % shuffledBase.length];
    // Se realiza una copia profunda para aislar instancias
    result500.push({
      category: originalItem.category,
      question: originalItem.question,
      options: [...originalItem.options],
      answer: originalItem.answer
    });
    index++;
  }

  return result500;
}

let questions = generate500Questions();
let currentQuestionIndex = 0;
let score = 0;
let isAnswering = false;

const gameScreen = document.getElementById('game-screen');
const resultsScreen = document.getElementById('results-screen');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const categoryEl = document.getElementById('category');
const scoreEl = document.getElementById('score');
const progressEl = document.getElementById('progress');
const nextBtn = document.getElementById('next-btn');

function startGame() {
  questions = generate500Questions();
  currentQuestionIndex = 0;
  score = 0;
  scoreEl.innerText = `Punts: ${score}`;
  resultsScreen.classList.add('hidden');
  gameScreen.style.display = 'flex';
  showQuestion();
}

function showQuestion() {
  isAnswering = false;
  nextBtn.classList.add('hidden');
  optionsEl.innerHTML = '';
  
  const q = questions[currentQuestionIndex];
  categoryEl.innerText = q.category;
  questionEl.innerText = q.question;
  progressEl.innerText = `${currentQuestionIndex + 1} / ${questions.length}`;
  
  const options = [...q.options].sort(() => Math.random() - 0.5);
  
  options.forEach(opt => {
    const button = document.createElement('button');
    button.innerText = opt;
    button.classList.add('option-btn');
    button.onclick = () => selectAnswer(button, opt, q.answer);
    optionsEl.appendChild(button);
  });
}

function selectAnswer(selectedBtn, selectedOpt, correctOpt) {
  if (isAnswering) return;
  isAnswering = true;
  
  const buttons = optionsEl.querySelectorAll('.option-btn');
  buttons.forEach(btn => {
    btn.disabled = true;
    if (btn.innerText === correctOpt) {
      btn.classList.add('correct');
    }
  });

  if (selectedOpt === correctOpt) {
    score += 1;
    scoreEl.innerText = `Punts: ${score}`;
    setTimeout(() => {
      nextQuestion();
    }, 550);
  } else {
    selectedBtn.classList.add('incorrect');
    nextBtn.classList.remove('hidden');
  }
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < questions.length) {
    showQuestion();
  } else {
    endGame();
  }
}

function endGame() {
  gameScreen.style.display = 'none';
  resultsScreen.classList.remove('hidden');
  document.getElementById('final-score').innerText = `Has aconseguit ${score} punts de ${questions.length} possibles!`;
}

startGame();
</script>
