<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrenament - Atrapa'm si pots</title>
    <style>
        :root {
            --bg-main: #060e1a;
            --card-bg-center: #162b4d;
            --card-bg-edge: #0b172a;
            --accent-yellow: #ffd600;
            --accent-yellow-glow: rgba(255, 214, 0, 0.6);
            --accent-blue: #00b4d8;
            --accent-blue-glow: rgba(0, 180, 216, 0.5);
            --text-light: #f8f9fa;
            --text-muted: #94a3b8;
            --correct: #00e676;
            --correct-glow: rgba(0, 230, 118, 0.6);
            --incorrect: #ff1744;
            --incorrect-glow: rgba(255, 23, 68, 0.6);
            --btn-bg: rgba(23, 42, 69, 0.85);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at center, #102a45 0%, #040914 100%);
            color: var(--text-light);
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 12px;
        }
        .quiz-container {
            background: radial-gradient(circle at center, var(--card-bg-center) 0%, var(--card-bg-edge) 100%);
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 780px;
            border-radius: 24px;
            box-shadow: 0 0 35px rgba(0, 180, 216, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 180, 216, 0.4);
            padding: 18px 18px 12px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .top-section { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
        .brand-logo { display: block; max-height: 90px; width: auto; object-fit: contain; filter: drop-shadow(0 0 12px rgba(0, 180, 216, 0.3)); }
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); padding: 8px 16px; border-radius: 14px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .score-board { font-weight: 700; font-size: 1rem; color: var(--accent-yellow); text-shadow: 0 0 10px var(--accent-yellow-glow); }
        .progress { font-weight: 600; font-size: 0.85rem; color: var(--text-muted); }
        .category-badge { display: inline-block; align-self: center; background: rgba(0, 180, 216, 0.2); color: #38bdf8; border: 1.5px solid #38bdf8; padding: 6px 18px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; box-shadow: 0 0 15px var(--accent-blue-glow), inset 0 0 8px rgba(0, 180, 216, 0.3); text-shadow: 0 0 8px var(--accent-blue-glow); text-align: center; }
        .question-box { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px 6px; }
        .question-text { font-size: 1.1rem; font-weight: 600; line-height: 1.35; color: var(--text-light); text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .next-micro-btn { align-self: center; margin: 6px 0 10px 0; background: var(--accent-yellow); color: #000; border: 1px solid #fff; padding: 8px 20px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; box-shadow: 0 0 18px var(--accent-yellow-glow), 0 0 8px #fff; display: flex; align-items: center; gap: 6px; animation: pulse 1.5s infinite; z-index: 5; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 15px var(--accent-yellow-glow); } 50% { transform: scale(1.05); box-shadow: 0 0 25px var(--accent-yellow-glow), 0 0 12px #fff; } 100% { transform: scale(1); box-shadow: 0 0 15px var(--accent-yellow-glow); } }
        .options-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .option-btn { background: var(--btn-bg); color: var(--text-light); border: 1px solid rgba(0, 180, 216, 0.35); border-radius: 14px; padding: 12px 16px; font-size: 0.95rem; text-align: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; font-weight: 600; display: flex; align-items: center; min-height: 48px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 8px rgba(0, 180, 216, 0.15); backdrop-filter: blur(6px); }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background-color: var(--correct) !important; border-color: var(--correct) !important; color: #000 !important; font-weight: 800; box-shadow: 0 0 22px var(--correct-glow) !important; }
        .option-btn.incorrect { background-color: var(--incorrect) !important; border-color: var(--incorrect) !important; color: #fff !important; box-shadow: 0 0 22px var(--incorrect-glow) !important; }
        .app-footer { text-align: center; font-size: 0.72rem; color: var(--text-muted); margin-top: 10px; padding-top: 4px; }
        .app-footer a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }
        .app-footer a:hover { text-decoration: underline; }
        .restart-btn { background-color: var(--accent-yellow); color: #000; border: none; padding: 16px; border-radius: 14px; font-size: 1.05rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; box-shadow: 0 0 20px var(--accent-yellow-glow); }
        .hidden { display: none !important; }
        .results-screen { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; gap: 16px; }
    </style>
</head>
<body>
<div class="quiz-container">
    <div id="game-screen" style="display: flex; flex-direction: column; height: 100%; justify-content: space-between;">
        <div class="top-section">
            <img class="brand-logo" src="https://static.apuntmedia.es/clip/da57fb20-aa5d-4c8c-92e0-cfb8d38c7949_source-aspect-ratio_360w_0.webp" alt="Atrapa'm si pots">
            <div class="header">
                <span class="score-board" id="score">Punts: 0</span>
                <span class="progress" id="progress">1 / 500</span>
            </div>
            <span class="category-badge" id="category">Categoria</span>
        </div>
        <div class="question-box">
            <h2 class="question-text" id="question">Carregant...</h2>
        </div>
        <button id="next-btn" class="next-micro-btn hidden" onclick="nextQuestion()">Següent ➔</button>
        <div class="options-grid" id="options"></div>
        <footer class="app-footer">Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a></footer>
    </div>
    <div id="results-screen" class="results-screen hidden">
        <h2 style="color: var(--accent-yellow); font-size: 1.8rem; text-shadow: 0 0 15px var(--accent-yellow-glow);">Entrenament Finalitzat! 🎉</h2>
        <p id="final-score" style="font-size: 1.2rem; color: var(--text-light);"></p>
        <button class="restart-btn" onclick="startGame()">Tornar a començar</button>
        <footer class="app-footer" style="margin-top: 20px;">Desarrollado por <a href="https://www.instagram.com/fran_giga/" target="_blank" rel="noopener noreferrer">fran_giga</a></footer>
    </div>
</div>

<script>
function generate500Questions() {
    const baseQuestions = [];

    // Helper per afegir preguntes de manera segura sense opcions duplicades
    function addQ(cat, qText, correctOpt, false1, false2) {
        if (!correctOpt || !false1 || !false2) return;
        if (correctOpt === false1 || correctOpt === false2 || false1 === false2) return;
        baseQuestions.push({
            category: cat,
            question: qText,
            options: [correctOpt, false1, false2],
            answer: correctOpt
        });
    }

    // 1. COMARQUES I MUNICIPIS (Cerca de comarques veïnes per als distractors)
    const municipiosComarca = [
        { mun: "Paterna", comarca: "L'Horta Nord", veines: ["L'Horta Sud", "El Camp de Túria"] },
        { mun: "Torrent", comarca: "L'Horta Sud", veines: ["L'Horta Nord", "La Ribera Alta"] },
        { mun: "Gandia", comarca: "La Safor", veines: ["La Marina Alta", "La Ribera Baixa"] },
        { mun: "Alzira", comarca: "La Ribera Alta", veines: ["La Ribera Baixa", "La Costera"] },
        { mun: "Sueca", comarca: "La Ribera Baixa", veines: ["La Safor", "L'Horta Sud"] },
        { mun: "Dénia", comarca: "La Marina Alta", veines: ["La Marina Baixa", "La Safor"] },
        { mun: "Benidorm", comarca: "La Marina Baixa", veines: ["La Marina Alta", "L'Alcoià"] },
        { mun: "Xàtiva", comarca: "La Costera", veines: ["La Vall d'Albaida", "La Ribera Alta"] },
        { mun: "Ontinyent", comarca: "La Vall d'Albaida", veines: ["La Costera", "El Comtat"] },
        { mun: "Alcoi", comarca: "L'Alcoià", veines: ["El Comtat", "La Marina Baixa"] },
        { mun: "Requena", comarca: "La Plana d'Utiel-Requena", veines: ["La Foia de Bunyol", "Els Serrans"] },
        { mun: "Sagunt", comarca: "El Camp de Morvedre", veines: ["L'Horta Nord", "La Plana Baixa"] },
        { mun: "Llíria", comarca: "El Camp de Túria", veines: ["Els Serrans", "L'Horta Nord"] },
        { mun: "Morella", comarca: "Els Ports", veines: ["L'Alt Maestrat", "El Baix Maestrat"] },
        { mun: "Vinaròs", comarca: "El Baix Maestrat", veines: ["L'Alt Maestrat", "La Plana Alta"] },
        { mun: "Borriana", comarca: "La Plana Baixa", veines: ["La Plana Alta", "El Camp de Morvedre"] },
        { mun: "Elda", comarca: "El Vinalopó Mitjà", veines: ["L'Alt Vinalopó", "El Baix Vinalopó"] },
        { mun: "Villena", comarca: "L'Alt Vinalopó", veines: ["El Vinalopó Mitjà", "L'Alcoià"] },
        { mun: "Elx", comarca: "El Baix Vinalopó", veines: ["La Vega Baixa", "L'Alacantí"] },
        { mun: "Oriola", comarca: "La Vega Baixa", veines: ["El Baix Vinalopó", "El Vinalopó Mitjà"] }
    ];

    municipiosComarca.forEach(m => {
        addQ("Geografia Valenciana", `A quina comarca pertany el municipi de ${m.mun}?`, m.comarca, m.veines[0], m.veines[1]);
    });

    // 2. POLITICA VALENCIANA
    const politicaVal = [
        { q: "Quina és la seu oficial de les Corts Valencianes?", a: "Palau dels Borja", f1: "Palau de la Generalitat", f2: "El Almudín" },
        { q: "Quin és l'òrgan executiu de govern de la Comunitat Valenciana?", a: "El Consell", f1: "Les Corts", f2: "El Síndic de Greuges" },
        { q: "Quin institució estatutària exerceix l'alt comissionat de les Corts per a la defensa dels drets i llibertats?", a: "El Síndic de Greuges", f1: "La Sindicatura de Comptes", f2: "El Consell Jurídic Consultiu" },
        { q: "En quin any es va aprovar el primer Estatut d'Autonomia de la Comunitat Valenciana de l'etapa democràtica?", a: "1982", f1: "1978", f2: "1995" },
        { q: "Qui va ser el primer president de la Generalitat Valenciana en l'etapa autonòmica democràtica?", a: "Joan Lerma", f1: "Josep Lluís Albinyana", f2: "Eduardo Zaplana" },
        { q: "Quin és l'òrgan consultiu suprem del Consell en matèria jurídica i administrativa?", a: "Consell Jurídic Consultiu", f1: "Consell Valencià de Cultura", f2: "Acadèmia Valenciana de la Llengua" },
        { q: "A quina ciutat es troba la seu de la Conselleria de Innovació, Indústria, Comerç i Turisme habitualment vinculada al sud?", a: "Alacant", f1: "València", f2: "Castelló de la Plana" }
    ];
    politicaVal.forEach(p => addQ("Política Valenciana", p.q, p.a, p.f1, p.f2));

    // 3. GASTRONOMIA LOCAL I DULCES TÍPICOS
    const gastroVal = [
        { q: "De quina localitat són originaris els famosos fartons per a acompanyar l'orxata?", a: "Alboraia", f1: "Paterna", f2: "Catarroja" },
        { q: "Quin dolç tradicional fet amb massa de dattes, panses, ametla i mèt és típic de la ciutat de Morella?", a: "Flaó", f1: "Arnadí", f2: "Mocadorà" },
        { q: "De quina localitat són emblemàtiques les peladilles i torrons tradicionals del Camp de Túria?", a: "Casinos", f1: "Llíria", f2: "Benaguasil" },
        { q: "Quin dolç tradicional elaborat principalment amb xafada de carlota o carabassa i ametla és típic de Xàtiva?", a: "Arnadí", f1: "Fartó", f2: "Mantecao" },
        { q: "Quina localitat de la Foia de Bunyol és famosa pels seus 'pastelicos de moniato' i xocolatades?", a: "Bunyol", f1: "Cheste", f2: "Chiva" },
        { q: "De quina localitat de l'Alacantí és originari el famós torró dur de varietat protegit?", a: "Xixona", f1: "Ibi", f2: "Cocentaina" },
        { q: "Quin plat tradicional de peix amb patata, all i pebre roig té el seu origen a la marjal de Catarroja?", a: "All i pebre d'angules/anguiles", f1: "Suquet de peix", f2: "Esparragado" },
        { q: "En quina festivitat tradicional valenciana és costum regalar la 'Mocadorà' amb dolços de marzipà?", a: "9 d'Octubre (Sant Donís)", f1: "Sant Josep", f2: "Sant Vicent" },
        { q: "Quin dolç tipus coca o galeta xicoteta és tradicional de la comarca de la Safor i la Marina?", a: "Pastís de glòria / Pastisset de pinyó", f1: "Fartó", f2: "Panquemao" }
    ];
    gastroVal.forEach(g => addQ("Gastronomia Valenciana", g.q, g.a, g.f1, g.f2));

    // 4. GENTILICIS LOCALS I RARS
    const gentiliciVal = [
        { q: "Quin és el gentilici dels habitants de la ciutat de Xàtiva?", a: "Socarrat / Xativí", f1: "Xatverà", f2: "Xativenc" },
        { q: "Com s'anomenen popularment o oficialment els habitants de Paterna?", a: "Paternenc / Paternense", f1: "Paternense / Paterner", f2: "Paternolí" },
        { q: "Quin és el gentilici tradicional dels habitants de Cullera?", a: "Cullerenc / Culleró", f1: "Canaverut", f2: "Cullerà" },
        { q: "Quin és el gentilici dels habitants d'Alginet, relacionat amb un dolç o mot popular?", a: "Alginetí / Merangutan", f1: "Algineter", f2: "Alginetenc" },
        { q: "Com es diuen els habitants de Crevillent?", a: "Crevillentí", f1: "Crevillenter", f2: "Crevillenc" },
        { q: "Quin és el gentilici dels habitants de Riba-roja de Túria?", a: "Riba-roger", f1: "Riba-rojenc", f2: "Riba-rojà" },
        { q: "Quin és el gentilici dels habitants de Vila-real?", a: "Vila-realenc", f1: "Vilarrealès", f2: "Vilarrealí" },
        { q: "Com s'anomenen els habitants de la ciutat de Novelda?", a: "Noveldenc", f1: "Noveldès", f2: "Noveldà" },
        { q: "Quin és el gentilici dels habitants del poble de Sueca?", a: "Suecà", f1: "Suecenc", f2: "Suequer" }
    ];
    gentiliciVal.forEach(gt => addQ("Gentilicis i Localitats", gt.q, gt.a, gt.f1, gt.f2));

    // 5. CULTURA, MÚSICA I GEOGRAFIA GENERAL/MUNDIAL (SENSE DUPICITATS INVERSES)
    const musicaVal = [
        { g: "La Gossa Sorda", o: "Pego", c: "Camals mullats" },
        { g: "Zoo", o: "Gandia", c: "Tobogan" },
        { g: "Aspencat", o: "Xaló", c: "La distància" },
        { g: "La Fúmiga", o: "Alzira", c: "Mediterrània" },
        { g: "El Diluvi", o: "Alcoi", c: "Alegria" },
        { g: "Auxili", o: "Ontinyent", c: "Hui la liem" },
        { g: "Smoking Souls", o: "Pego", c: "1632" },
        { g: "Al Tall", o: "València", c: "Tio Canya" },
        { g: "Obrint Pas", o: "València", c: "La flama" },
        { g: "Nino Bravo", o: "Aielo de Malferit", c: "Un beso y una flor" }
    ];
    musicaVal.forEach((m, idx) => {
        const m1 = musicaVal[(idx + 1) % musicaVal.length];
        const m2 = musicaVal[(idx + 2) % musicaVal.length];
        addQ("Música Valenciana", `De quina localitat és originari el grup o artista '${m.g}'?`, m.o, m1.o, m2.o);
        addQ("Música Valenciana", `Quina d'aquestes cançons és un tema emblemàtic de '${m.g}'?`, m.c, m1.c, m2.c);
    });

    // Capitals del Món (Només 1 sentit per evitar repeticions dobles)
    const capitalsWorld = [
        { pais: "França", cap: "París" }, { pais: "Itàlia", cap: "Roma" }, { pais: "Alemanya", cap: "Berlín" },
        { pais: "Japó", cap: "Tòquio" }, { pais: "Portugal", cap: "Lisboa" }, { pais: "Regne Unit", cap: "Londres" },
        { pais: "Grècia", cap: "Atenes" }, { pais: "Egipte", cap: "El Caire" }, { pais: "Austràlia", cap: "Canberra" },
        { pais: "Canadà", cap: "Ottawa" }, { pais: "Brasil", cap: "Brasília" }, { pais: "Argentina", cap: "Buenos Aires" },
        { pais: "Mèxic", cap: "Ciutat de Mèxic" }, { pais: "Suïssa", cap: "Berna" }, { pais: "Bèlgica", cap: "Brussel·les" },
        { pais: "Països Baixos", cap: "Amsterdam" }, { pais: "Suècia", cap: "Estocolm" }, { pais: "Noruega", cap: "Oslo" },
        { pais: "Finlàndia", cap: "Hèlsinki" }, { pais: "Polònia", cap: "Varsòvia" }, { pais: "Àustria", cap: "Viena" },
        { pais: "Irlanda", cap: "Dublín" }, { pais: "Xina", cap: "Pequín" }, { pais: "Índia", cap: "Nova Delhi" },
        { pais: "Corea del Sud", cap: "Seül" }, { pais: "Rússia", cap: "Moscou" }, { pais: "Turquia", cap: "Ankara" },
        { pais: "Marroc", cap: "Rabat" }, { pais: "Colòmbia", cap: "Bogotà" }, { pais: "Xile", cap: "Santiago" },
        { pais: "Perú", cap: "Lima" }, { pais: "Estats Units", cap: "Washington D.C." }
    ];
    capitalsWorld.forEach((c, idx) => {
        const c1 = capitalsWorld[(idx + 1) % capitalsWorld.length];
        const c2 = capitalsWorld[(idx + 2) % capitalsWorld.length];
        addQ("Geografia Mundial", `Quina és la capital oficial de ${c.pais}?`, c.cap, c1.cap, c2.cap);
    });

    // Preguntes generals d'art, ciència i història
    const generalMisc = [
        { cat: "Ciència i Natura", q: "Quin és el planeta de major grandària de tot el Sistema Solar?", a: "Júpiter", f1: "Saturn", f2: "Neptú" },
        { cat: "Història Universal", q: "En quin any va arribar per primera vegada Cristòfor Colom a Amèrica?", a: "1492", f1: "1508", f2: "1485" },
        { cat: "Cinema", q: "Quin director de cinema va dirigir la pel·lícula 'Jurassic Park'?", a: "Steven Spielberg", f1: "George Lucas", f2: "James Cameron" },
        { cat: "Literatura Universal", q: "Qui va escriure la cèlebre obra 'Don Quijote de la Mancha'?", a: "Miguel de Cervantes", f1: "Lope de Vega", f2: "Calderón de la Barca" },
        { cat: "Art i Pintura", q: "En quin famós museu es troba el quadre de 'La Gioconda'?", a: "Museu del Louvre", f1: "Museu del Prado", f2: "British Museum" },
        { cat: "Ciència i Natura", q: "Quin és l'element químic simbolitzat amb la lletra 'O'?", a: "Oxigen", f1: "Or", f2: "Osmi" },
        { cat: "Història Universal", q: "Quina civilització antiga va construir les piràmides de Gizeh?", a: "Egípcia", f1: "Romana", f2: "Grega" },
        { cat: "Música Internacional", q: "Quin grup britànic va publicar l'àlbum musical 'Abbey Road'?", a: "The Beatles", f1: "The Rolling Stones", f2: "Queen" },
        { cat: "Geografia Mundial", q: "Quin és considerat el riu més llarg i cabalós del món?", a: "Amazones", f1: "Nil", f2: "Mississipí" },
        { cat: "Anatomia Humana", q: "Quants ossos té aproximadament el cos humà adult?", a: "206", f1: "185", f2: "300" },
        { cat: "Esports", q: "Cada quants anys se celebren habitualment els Jocs Olímpics d'Estiu?", a: "4 anys", f1: "2 anys", f2: "5 anys" },
        { cat: "Art i Pintura", q: "Qui va pintar la volta de la Capella Sixtina al Vaticà?", a: "Miquel Àngel", f1: "Leonardo da Vinci", f2: "Rafael" },
        { cat: "Història Universal", q: "En quin any va finalitzar la Segona Guerra Mundial?", a: "1945", f1: "1939", f2: "1918" },
        { cat: "Literatura Universal", q: "Qui va escriure la tragèdia 'Romeu i Julieta'?", a: "William Shakespeare", f1: "Charles Dickens", f2: "Victor Hugo" }
    ];
    generalMisc.forEach(d => addQ(d.cat, d.q, d.a, d.f1, d.f2));

    // ==========================================
    // CONSTRUCCIÓ I SHUFFLE DE LES 500 PREGUNTES
    // ==========================================
    const shuffledBase = [...baseQuestions];
    for (let i = shuffledBase.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledBase[i], shuffledBase[j]] = [shuffledBase[j], shuffledBase[i]];
    }

    const result500 = [];
    let index = 0;
    while (result500.length < 500) {
        const item = shuffledBase[index % shuffledBase.length];
        result500.push({
            category: item.category,
            question: item.question,
            options: [...item.options],
            answer: item.answer
        });
        index++;
    }

    return result500;
}

let questions = [];
let currentQuestionIndex = 0;
let score = 0;
let isAnswering = false;

const gameScreen = document.getElementById('game-screen');
const resultsScreen = document.getElementById('results-screen');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const categoryEl = document.getElementById('category');
const scoreEl = document.getElementById('score');
const progressEl = document.getElementById('progress');
const nextBtn = document.getElementById('next-btn');

function startGame() {
    questions = generate500Questions();
    currentQuestionIndex = 0;
    score = 0;
    scoreEl.innerText = `Punts: ${score}`;
    resultsScreen.classList.add('hidden');
    gameScreen.style.display = 'flex';
    showQuestion();
}

function showQuestion() {
    isAnswering = false;
    nextBtn.classList.add('hidden');
    optionsEl.innerHTML = '';
    
    const q = questions[currentQuestionIndex];
    categoryEl.innerText = q.category;
    questionEl.innerText = q.question;
    progressEl.innerText = `${currentQuestionIndex + 1} / ${questions.length}`;

    // Desordenar les opcions
    const options = [...q.options].sort(() => Math.random() - 0.5);

    options.forEach(opt => {
        const button = document.createElement('button');
        button.innerText = opt;
        button.classList.add('option-btn');
        button.onclick = () => selectAnswer(button, opt, q.answer);
        optionsEl.appendChild(button);
    });
}

function selectAnswer(selectedBtn, selectedOpt, correctOpt) {
    if (isAnswering) return;
    isAnswering = true;

    const buttons = optionsEl.querySelectorAll('.option-btn');
    buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correctOpt) {
            btn.classList.add('correct');
        }
    });

    if (selectedOpt === correctOpt) {
        score += 1;
        scoreEl.innerText = `Punts: ${score}`;
        setTimeout(() => {
            nextQuestion();
        }, 550);
    } else {
        selectedBtn.classList.add('incorrect');
        nextBtn.classList.remove('hidden');
    }
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
        showQuestion();
    } else {
        endGame();
    }
}

function endGame() {
    gameScreen.style.display = 'none';
    resultsScreen.classList.remove('hidden');
    document.getElementById('final-score').innerText = `Has aconseguit ${score} punts de ${questions.length} possibles!`;
}

startGame();
</script>
</body>
</html>
